<!DOCTYPE html>
<html>
<head>
	<title>GeoWeb :: Leaflet Servicio WPS</title>
	<meta charset="utf-8" />
  <link rel="icon" href="data:," />
  <meta name="description" content="Taller WPS Consulta espacial" />
  <meta name="keywords" content="html, geoweb, desarrollo web"/>
  <meta name="author" content="Grupo de Geoweb CIG 2025" />
  <meta name="copyright" content="CentroGeo 2026" />
  <meta name="robots" content="index,follow" />
  <meta http-equiv="cache-control" content="no-cache"/>
  <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui' />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
	<link href='css/world.css' rel='stylesheet' />
</head>

<body>
	<h2>Mapa de consulta a WPS-Consulta espacial</h2>

	<div id='map'></div>
	<div id="formulario">
		<form action="#" method="post" id="envio_post">
			Punto wkt <input type="radio" name="optFiltro" id="puntoWkt" /><br/>
			Linea wkt <input type="radio" name="optFiltro" id="lineaWkt" /><br/>
			Polígono wkt <input type="radio" name="optFiltro" id="poligonoWkt" /><br/>
			Multipunto wkt <input type="radio" name="optFiltro" id="multipuntoWkt" /><br/>
			Colección de geometrías wkt <input type="radio" name="optFiltro" id="geometrycollectionWkt" /><br/>			
			<input type="submit" value="Enviar">
		</form>
	</div>	
    <span id="contenido"></span>
	<script>
	var map = L.map('map').setView([20.0, -10.0], 2); // ajustar coordenadas y nivel de zoom

	var Stadia_AlidadeSmooth = L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth/{z}/{x}/{y}{r}.png', {
		maxZoom: 20,
		attribution: '&copy; <a href="https://stadiamaps.com/">Stadia Maps</a>, &copy; <a href="https://openmaptiles.org/">OpenMapTiles</a> &copy; <a href="http://openstreetmap.org">OpenStreetMap</a> contributors'
	}).addTo(map);

////////////////////////////////////////////////////
function popUpInfo(features,layer) {
    if (features.properties && features.properties.nombre) {
			//layer.bindPopup("<b>Alcaldia:" + features.properties.cve_nomgeo + "</b><br/>Poblacion = " + features.properties.cve_pob_2015);
			layer.bindTooltip("<b>Pais:" + features.properties.nombre + "</b><br/>Poblacion 2005= " + features.properties.pop2005 + "<br/>Clave de ISO3 =" + features.properties.iso3);
    }
}
var miconsulta = L.geoJson(null, {
  style: function(feature){
		return {
			stroke: true,
			color: "#ffffff", 
			weight: 1.5,
			opacity: 0.9,
			fillColor: getColour(feature.properties.un),
			fillOpacity: 0.6
		};
	},
    onEachFeature: popUpInfo
});

function getColour(codigoONU) {
	if(!codigoONU) return "#999999";

	var paleta= [
		"#e53935", // Rojo
    "#1e88e5", // Azul
    "#43a047", // Verde
    "#ffb300", // Amarillo/Naranja
    "#8e24aa", // Morado
    "#00acc1", // Turquesa
    "#f4511e", // Naranja fuerte
    "#3949ab", // Índigo
    "#7cb342", // Verde claro
    "#d81b60"  // Rosa oscuro
	];
	var indice= codigoONU % 10;
	return paleta[indice];
}
///////////////////////////////////////////////////
var micapaWkt = L.geoJson(null, {});
$(document).ready(function(){
    $('#envio_post').submit(function() {
		var opcionPunto = $("#puntoWkt").is(":checked");
		var opcionLinea = $("#lineaWkt").is(":checked");
		var opcionPoligono = $("#poligonoWkt").is(":checked");
		var opcionMultipunto = $("#multipuntoWkt").is(":checked");
		var opcionGeometrycollection = $("#geometrycollectionWkt").is(":checked");		
		
		if (opcionPunto == false && opcionLinea==false  && opcionPoligono==false  && opcionMultipunto==false && opcionGeometrycollection==false){
			alert("Selecciona alguna de las opciones de consulta");
			return false;
		} else {
			micapaWkt.clearLayers();
			var URL= "";
			var wkt= "";
			if (opcionPunto == true) {
				// Punto sobre la Penìsula de Yucatàn
				var valores = { "type": "Point", "coordinates": [-89.62, 20.96] };
				wkt= 'POINT(-89.62 20.96)';
				URL = 'http://10.20.2.186/pywps?REQUEST=execute&SERVICE=WPS&version=1.0.0&identifier=FiltroEspacialWorld&dataInputs=geo='+ encodeURIComponent(wkt);
			} else if (opcionLinea == true) {	
				// Linea trasatlàntica: CDMX, Nueva York -> Londres -> Roma
				var valores = {
						"type": "LineString",
						"coordinates": [
								[ -99.13, 19.43 ],
								[ -74.00, 40.71 ],
								[ -0.12, 51.50 ],
								[ 12.49, 41.90 ]
						]
				};
				var wkt= 'LINESTRING(-99.13 19.43, -74.00 40.71, -0.12 51.50, 12.49 41.90)';
				var URL = 'http://10.20.2.186/pywps?REQUEST=execute&SERVICE=WPS&version=1.0.0&identifier=FiltroEspacialWorld&dataInputs=geo=' + encodeURIComponent(wkt);
			} else if(opcionPoligono == true) {
				// Triàngulo gigante: Maiami -> Londres -> Dakar
				var valores = {
						"type": "Polygon",
						"coordinates": [
								[
										[ -80.19, 25.76 ],
										[ -0.12, 51.50 ],
										[ -17.46, 14.71 ],
										[ -80.19, 25.76 ]
								]
						]
				};
				wkt= 'POLYGON((-80.19 25.76, -0.12 51.50,-17.49 14.71, -80.19 25.76))';
				var URL = 'http://10.20.2.186/pywps?REQUEST=execute&SERVICE=WPS&version=1.0.0&identifier=FiltroEspacialWorld&dataInputs=geo=' + encodeURIComponent(wkt);
			} else if(opcionMultipunto == true) {
				// Puntos globales: CDMX, Tokio, El Cairo, Sidney
				var valores = {
    			"type": "MultiPoint",
    			"coordinates": [ [-99.13, 19.43], [139.69, 35.68], [ 31.23, 30.04 ], [ 151.20, -33.86 ] ]
				};
				var wkt= 'MULTIPOINT((-99.13 19.43),(139.69 35.68), (31.23 30.04), (151.20 -33.86))';		
				var URL = 'http://10.20.2.186/pywps?REQUEST=execute&SERVICE=WPS&version=1.0.0&identifier=FiltroEspacialWorld&dataInputs=geo=' + encodeURIComponent(wkt);
			} else {
				var valores = {
					// Colecciòn de Geometrìas: El punto de Yucatan + Linea trasatlàntica
						"type": "GeometryCollection",
						"geometries": [
								{ "type": "Point", "coordinates": [-89.62,20.96] },
								{
									"type": "LineString",
										"coordinates": [
												[ -99.13, 19.43 ],
												[ -74.00, 40.71 ],
												[ -0.12, 51.50 ],
												[ 12.49, 41.90 ]
										]
								}
						]
				};
				var wkt= 'GEOMETRYCOLLECTION(POINT(-89.62 20.96), LINESTRING(-99.13 19.43, -74.00 40.71, -0.12 51.50, 12.49 41.90))';
				var URL = 'http://10.20.2.186/pywps?REQUEST=execute&SERVICE=WPS&version=1.0.0&identifier=FiltroEspacialWorld&dataInputs=geo=' + encodeURIComponent(wkt);
			}
			micapaWkt.addData(valores);
			micapaWkt.addTo(map);
			var contenido_html = "";
			var ajax_wps = $.ajax({
        type: "GET",
			  url: URL,
        dataType: "xml",
				success : function (xml_res) {
					var data = $(xml_res).children().children().children().children().children()[0];
					var respuesta = $(data).text();
					var respuesta = JSON.parse(respuesta);
					console.log(respuesta);				
					//limpia la capa temporal de consulta anterior
					miconsulta.clearLayers();
					$('#contenido').html('');

					if(respuesta.features.length > 0) {
						miconsulta.addData(respuesta);
						//Recorre los resultados obtenidos
						//console.log(respuesta);
						for (var i = 0; i < respuesta.features.length; i++) {
							contenido_html = "Pais: " + respuesta.features[i].properties.nombre + "<br/>";
							contenido_html += "Clave ISO3: " + respuesta.features[i].properties.iso3 + "<br/>";
							contenido_html += "Clave ONU: " + respuesta.features[i].properties.un + "<br/>";
							contenido_html += "Poblacion (2005): " + respuesta.features[i].properties.pop2005 + "<br/>";
							contenido_html += "Area: " + respuesta.features[i].properties.area + "<br/>";
							contenido_html += "<hr/>";
							$('#contenido').append(contenido_html);
						} //fin del for
					} else {
						contenido_html = "La consulta no tiene resultados";
						$('#contenido').append(contenido_html); 
					}
				
			},
			error : function(jqXHR, estado, error) {
				$('#contenido').html('Se produjo un error:' + estado + ' error: ' + error);
			}
			});
			///////////////////////////////////////
			miconsulta.addTo(map);

			//previene el re-envío del requerimiento
			return false;
		} //fin del if que verifica la seleccion de radio button
	}); //fin del evento submit
}); //fin de la fn document.ready

	</script>
</body>
</html>
