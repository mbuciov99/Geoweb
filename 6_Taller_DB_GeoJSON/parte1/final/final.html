<!DOCTYPE html>
<html>
<head>
	<title>GeoWeb :: Leaflet Capa GeoJSON-DB</title>
	<meta charset="utf-8" />
  <link rel="icon" href="data:," />
  <meta name="description" content="Taller leaflet BD GeoJSON" />
  <meta name="keywords" content="html, geoweb, desarrollo web"/>
  <meta name="author" content="Grupo de Geoweb CIG 2025" />
  <meta name="copyright" content="CentroGeo 2026" />
  <meta name="robots" content="index,follow" />
  <meta http-equiv="cache-control" content="no-cache"/>
  <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui' />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script src="https://code.jquery.com/jquery-4.0.0.js"></script>	
	<style>
			html, body {
		margin: 0;
		padding: 0;
	}
	#map {
		position: absolute;
		top: 1;
		bottom: 1;
		width: 600px;
		height: 400px;
	}
	#contenido {
		position: relative;
		top: 380px;
	}
	#formulario {
		position: relative;
		left: 600px;
		width: 400px;
	}

  </style>
</head>

<body>
	<h2>Mapa de consulta a BD</h2>

	<div id='map'></div>
	<div id="formulario">
		<form action="#" method="get" id="envio_get">
			<select name="tipo" id="tipo">
				<option value="cpis">CENTROS DE INVESTIGACION</option>
				<option value="empresas">EMPRESAS</option>
				<option value="ies">INSTITUCIONES DE ENSEÑANZA SUPERIOR </option>
				<option value="iap">INSTITUCIONES DE LA ADMINISTRACION PUBLICA</option>
				<option value="ip">INSTITUCIONES PRIVADAS NO LUCRATIVAS</option>
				<option value="fisica">PERSONA FISICA</option>
			</select>
			<input type="submit" value="Enviar">
		</form>
	</div>	
    <span id="contenido"></span>
	<script>
	var map = L.map('map').setView([19.29075, -99.22141], 5); // ajustar coordenadas y nivel de zoom

	var osmLayer = L.tileLayer('http://{s}.tile.osm.org/{z}/{x}/{y}.png', {
		attribution: '&copy; <a href="http://osm.org/copyright">OpenStreetMap<\/a> contributors'
	}).addTo(map);

	function popUpInfo(features,layer) {
		if(features.properties && features.properties.nombre) {
			layer.bindPopup("<b>"+features.properties.nombre+"</b><br/>"+features.properties.delmun+"</b><br/>"+features.properties.tamanio);
		}
	}

	var miconsulta = L.geoJson(null, {
		pointToLayer: function(features,latlng) {
			var tamanio = features.properties.tamanio;
			if(tamanio =="GRANDE") {
				return L.circleMarker(latlng, {color:"#ff0000", weight:25});
			} else if(tamanio=="MEDIANA") {
				return L.circleMarker(latlng, {color:"#fc8505", weight:20});
			} else if(tamanio=="MICRO") {
				return L.circleMarker(latlng, {color:"#4b6f9c", weight:10});
			} else if(tamanio=="NINGUNA") {
				return L.circleMarker(latlng, {color:"#767578",weight:5});
			} else if(tamanio=="PEQUEÑA") {
				return L.circleMarker(latlng, {color:"#118a11",weight:15});
			} else {
				return L.circleMarker(latlng, {color:"#000000",weight:3});
			}
		},
		onEachFeature: popUpInfo
	});


////////////////////////////////////////////////////

$(document).ready(function(){
  $('#envio_get').submit(function() {
    var URL = 'php/listaInst_geojson.php';
    var contenido_html = "";
    var ajax_get = $.ajax({
	    type : "GET",
      url : URL,
      dataType : 'json',
		  data : {
				tipo : $('#tipo option:selected').html().trim()
		  },
      contentType: 'application/json',
	    timeout:10000,
      success : function (response) {
				console.log(response);
				console.log(response.features.length);
			
				$('#contenido').html('');
				miconsulta.clearLayers();
		  	if(response.features.length > 0) {
					miconsulta.addData(response);
			//Recorre los resultados obtenidos
					for(var i = 0; i < response.features.length; i++) {
						contenido_html = "Nombre " + response.features[i].properties.nombre + "<br/>";
						contenido_html += "Tipo: " + response.features[i].properties.tipo + "<br/>";
						contenido_html += "Municipio: " + response.features[i].properties.delmun + "<br/>";
						contenido_html += "Entidad: " + response.features[i].properties.entidad + "<br/>";
						contenido_html += "Sector: " + response.features[i].properties.sector + "<br/>";
						contenido_html += "Rama: " + response.features[i].properties.rama + "<br/>";
						contenido_html += "Clase: " + response.features[i].properties.clase + "<br/>";
						contenido_html += "<hr/>";
						$('#contenido').append(contenido_html);
					} //fin del for
				} else {
					contenido_html = "La consulta no tiene resultados";
					$('#contenido').append(contenido_html);
				}
			},
			error : function(jqXHR, estado, error) {
				$('#contenido').html('Se produjo un error:' + estado + ' error: ' + error);
			}
    });
		miconsulta.addData(map);
		//previene el re-envío del requerimiento
		return false;
	});
});

	
	</script>
</body>
</html>
