<!DOCTYPE html>
<html>
    <head>
      <title>Geoweb: Leaflet: GeoJSON Externo</title>
      <meta charset="utf-8" />
      <link rel="icon" href="data:," />
      <meta name="description" content="Taller leaflet BD GeoJSON" />
      <meta name="keywords" content="html, geoweb, desarrollo web"/>
      <meta name="author" content="Grupo de Geoweb CIG 2025" />
      <meta name="copyright" content="CentroGeo 2026" />
      <meta name="robots" content="index,follow" />
      <meta http-equiv="cache-control" content="no-cache"/>
      <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui' />
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
      <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
      <script src="https://code.jquery.com/jquery-4.0.0.js"></script>	
    </head>
      
    <body>
      
      <div id="map" style="width: 100%; height: 500px;"></div>
        <script>
            //Tomado de: https://codepen.io/dagmara223/pen/LWYNJO
            var map = L.map('map').setView([40, -120], 2);

            var osmLayer = L.tileLayer('http://{s}.tile.osm.org/{z}/{x}/{y}.png', {
		    attribution: '&copy; <a href="http://osm.org/copyright">OpenStreetMap<\/a> contributors'
	        }).addTo(map);

        
      $.getJSON('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson', function(json) {

        var geoLayer = L.geoJson(json, {
          style: function(feature) {
            var mag = feature.properties.mag;
            if (mag >= 4.0) {
              return {
                color: "red"
              }; 
            }
            else if (mag >= 3.0) {
              return {
                color: "orange"
              };
            } else if (mag >= 2.0) {
              return {
                color: "yellow"
              };
            } else {
              return {
                color: "green"
              }
            }
          },
          onEachFeature: function(feature, layer) {
            var popupText = "<b>Magnitude:</b> " + feature.properties.mag +
              "<br><b>Location:</b> " + feature.properties.place +
              "<br><a href='" + feature.properties.url + "' target='_blank'>More info</a>";

            layer.bindPopup(popupText, {
              closeButton: true,
              offset: L.point(0, -20)
            });
            layer.on('click', function() {
              layer.openPopup();
            });
          },
          pointToLayer: function(feature, latlng) {
            return L.circleMarker(latlng, {
            radius: Math.round(feature.properties.mag), //* 3,
          });
          }
        }).addTo(map);
      });
        </script>  
      </body>
      
      </html>
</html>
